spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 80
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 1000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope: profile_nickname, account_email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET_NAME}
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2

kakao:
  redirect-uri: ${KAKAO_REDIRECT_URI}

portone:
  api-url: https://api.portone.io
  api-secret: ${PORTONE_API_SECRET}
  store-id: ${PORTONE_STORE_ID}
  channel-key:
    card: ${PORTONE_CHANNEL_KEY_CARD}
    mobile-card: ${MOBILE_PORTONE_CHANNEL_KEY_CARD}
    kakao-pay: ${PORTONE_CHANNEL_KEY_KAKAOPAY}
    naver-pay: ${PORTONE_CHANNEL_KEY_NAVERPAY}
    toss-pay: ${PORTONE_CHANNEL_KEY_TOSSPAY}

tracker:
  client-id: ${TRACKER_CLIENT_ID}
  client-secret: ${TRACKER_CLIENT_SECRET}
  api-url: https://apis.tracker.delivery/graphql
  timeout-seconds: 15

springdoc:
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

logging:
  level:
    org.hibernate.SQL_SLOW: INFO

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://www.myfave.shop,https://myfave.shop}

server:
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: 400
