spring:
  # datasource는 TestContainers @ServiceConnection이 동적 주입
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100

  # Redis (docker-compose의 localhost:6379 사용 — 실 호출은 거의 없지만 빈 초기화 필요)
  data:
    redis:
      host: localhost
      port: 6379

  # 이메일 발송 (실 호출 없음, 빈 초기화용 더미)
  mail:
    host: smtp.test.com
    port: 587
    username: test@test.com
    password: test-password

  # 카카오 소셜 로그인 (실 호출 없음, 빈 초기화용 더미)
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client
            client-secret: test-kakao-secret
            scope: profile_nickname, account_email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # AWS S3 (실 호출 없음, 빈 초기화용 더미)
  cloud:
    aws:
      s3:
        bucket: test-bucket
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
      region:
        static: ap-northeast-2

# 인플루언서 (운영 yml과 동일하게 user-id=1)
influencer:
  user-id: 1

# JWT 더미
jwt:
  secret: test-jwt-secret-key-must-be-at-least-256-bits-long-for-integration-test-only
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000

kakao:
  redirect-uri: http://localhost:5173/oauth/kakao/callback

# 포트원 더미 (PaymentProvider는 @MockBean으로 대체)
portone:
  api-url: https://test.portone.io
  api-secret: test-api-secret
  store-id: test-store
  channel-key:
    card: test-channel-card
    kakao-pay: test-channel-kakaopay
    naver-pay: test-channel-naverpay
    toss-pay: test-channel-tosspay
