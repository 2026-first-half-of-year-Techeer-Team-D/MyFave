plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.myfave'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// Spring Boot 3.4.1 기본 testcontainers(1.20.4)는 docker-java 3.4.x 사용 → 최신 Docker Desktop(API 1.44+)과 호환 안 됨
// io.spring.dependency-management 프로퍼티 override (2.0.x는 docker-java 새 버전 사용)
ext['testcontainers.version'] = '1.21.4'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 핵심
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // DB
    runtimeOnly 'org.postgresql:postgresql'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // 이메일 인증 (JavaMailSender + @Async + Redis 조합)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 카카오 소셜 로그인
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // AWS S3 파일 업로드 (이미지, GIF, 영상)
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.1.1'

    // 외부 결제 API 호출 (Toss, 카카오페이, 네이버페이)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Swagger (SpringDoc)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // 통합 테스트용 TestContainers (PostgreSQL)
    // 버전은 build.gradle 상단 ext['testcontainers.version']에서 관리
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
    // docker-java 3.4.x는 기본 API 1.32 사용 → 최신 Docker Desktop(1.44+ 필수)과 충돌. 명시적 버전 지정
    environment 'DOCKER_API_VERSION', '1.45'
}
